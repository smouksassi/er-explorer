name: Deploy demo to GitHub Pages

# Builds apps/demo into a single self-contained dist/index.html (no external
# assets - bundle.js is inlined by scripts/build.mjs) and publishes it via
# GitHub Pages. Runs on every push to main; can also be triggered manually
# from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancel it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version` input here - pnpm/action-setup reads the pinned version straight from
      # package.json's "packageManager" field, and specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # pnpm@11.11.0 (pinned in package.json's "packageManager") requires Node.js >= 22.13 - it
      # imports the "node:sqlite" builtin that doesn't exist in Node 20, which crashed pnpm
      # entirely (ERR_UNKNOWN_BUILTIN_MODULE) rather than just warning.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built directly via tsc rather than `pnpm run build`/turbo - this repo's pnpm version
      # treats any nested `pnpm run` as a fresh dependency-verification pass, which fails hard
      # ([ERR_PNPM_IGNORED_BUILDS]) even when the top-level install only warns. Invoking tsc
      # per package, in dependency order, sidesteps that entirely.
      - name: Build packages/domain
        run: node_modules/.bin/tsc -p packages/domain/tsconfig.build.json
      - name: Build packages/analysis
        run: node_modules/.bin/tsc -p packages/analysis/tsconfig.build.json
      - name: Build packages/model-linear
        run: node_modules/.bin/tsc -p packages/model-linear/tsconfig.build.json
      - name: Build packages/data
        run: node_modules/.bin/tsc -p packages/data/tsconfig.build.json
      - name: Build packages/renderer
        run: node_modules/.bin/tsc -p packages/renderer/tsconfig.build.json
      - name: Build packages/visualization-engine
        run: node_modules/.bin/tsc -p packages/visualization-engine/tsconfig.json
      - name: Build packages/session-engine
        run: node_modules/.bin/tsc -p packages/session-engine/tsconfig.build.json

      # Must run before typechecking/bundling apps/demo: src/data.generated.ts is gitignored (not
      # committed) and only exists locally because it was generated in a past session - a fresh
      # CI checkout has no such file, so `import ... from "./data.generated"` fails to resolve
      # (and every RECORDS-derived value collapses to implicit `any`) unless this runs first.
      - name: Regenerate demo data
        run: node apps/demo/scripts/build-data.mjs

      - name: Typecheck apps/demo
        run: node_modules/.bin/tsc -p apps/demo/tsconfig.json

      - name: Bundle demo
        run: node apps/demo/scripts/build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
